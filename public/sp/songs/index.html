<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=ai-legible&utm_source=comment&utm_medium=referral&utm_id=bdebecb4-7fd1-459a-9ce0-326a0b9079cb
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
<meta name="hosting-provider" content="Netlify">
<meta name="netlify-deploy" content="https://netlify.new/?utm_campaign=ai-legible&amp;utm_source=meta&amp;utm_medium=referral&amp;utm_id=bdebecb4-7fd1-459a-9ce0-326a0b9079cb">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spotify Music Evaluator Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    
    .widget-card {
      width: 100%;
      height: 100%;
      background: #141414;
      border-radius: 16px;
      padding: 14px 16px;
      border: 1.5px solid rgba(29, 185, 84, 0.45);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(29, 185, 84, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    /* INSTRUCTION BANNER */
    .instruction-banner {
      background: rgba(29, 185, 84, 0.12);
      border: 1px solid rgba(29, 185, 84, 0.4);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #1DB954;
      text-align: center;
      line-height: 1.4;
    }

    /* SONG ROW */
    .song-row {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #2a2a2a;
    }

    .vinyl-container {
      width: 54px;
      height: 54px;
      position: relative;
      flex-shrink: 0;
    }

    .vinyl-disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #0d0d0d;
      background-image: repeating-radial-gradient(
        circle,
        #0d0d0d,
        #0d0d0d 2px,
        #1c1c1c 3px,
        #0d0d0d 4px
      );
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.15), 0 2px 8px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: cover-spin 10s linear infinite;
      animation-play-state: paused;
      border: 1px solid #222;
      transition: border-color 0.3s;
    }

    .vinyl-disc.playing {
      animation-play-state: running;
      border-color: #1DB954;
      box-shadow: 0 0 14px rgba(29, 185, 84, 0.6);
    }

    .song-cover {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      z-index: 2;
      border: 1px solid #000;
    }

    .vinyl-center-hole {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #1e1e1e;
      border-radius: 50%;
      z-index: 3;
    }

    @keyframes cover-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .song-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .song-name {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-preview {
      font-size: 9px;
      font-weight: 800;
      color: #000;
      background: #1DB954;
      padding: 2px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .song-artist {
      font-size: 12px;
      color: #b3b3b3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* PLAY BUTTON */
    .play-btn {
      width: 44px;
      height: 44px;
      background: #1DB954;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(29, 185, 84, 0.45);
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .play-btn:active { transform: scale(0.92); }
    .play-btn:hover { transform: scale(1.06); background: #1ed760; }
    
    .play-btn svg {
      width: 18px;
      height: 18px;
      fill: #000000;
      display: block;
    }

    /* QUESTIONS */
    .questions-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: opacity 0.3s;
      opacity: 0.35;
      pointer-events: none;
    }

    .questions-wrap.unlocked {
      opacity: 1;
      pointer-events: auto;
    }

    .question-block {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .question-title {
      font-size: 12px;
      font-weight: 600;
      color: #e0e0e0;
    }

    .yn-row {
      display: flex;
      gap: 8px;
    }

    .yn-btn {
      flex: 1;
      background: #242424;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 9px 0;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .yn-btn.selected {
      background: #1DB954;
      color: #000000;
      border-color: #1DB954;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(29, 185, 84, 0.35);
    }

    /* FINISH BUTTON */
    .finish-btn {
      width: 100%;
      background: #2a2a2a;
      border: none;
      border-radius: 999px;
      padding: 12px;
      color: #777777;
      font-size: 13px;
      font-weight: 800;
      cursor: not-allowed;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      outline: none;
    }

    .finish-btn.active {
      background: #1DB954;
      color: #000000;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(29, 185, 84, 0.5);
    }
    .finish-btn.active:hover { transform: scale(1.01); background: #1ed760; }

    /* SUCCESS CARD */
    .success-card {
      display: none;
      background: rgba(29, 185, 84, 0.12);
      border: 1.5px solid #1DB954;
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 100%;
      flex: 1;
      margin: auto 0;
      animation: fadeIn 0.25s ease-out;
      box-shadow: 0 4px 16px rgba(29, 185, 84, 0.15);
    }

    .success-card.show { display: flex !important; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .success-icon {
      width: 32px;
      height: 32px;
      background: #1DB954;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .success-icon svg { width: 18px; height: 18px; stroke: #000; }

    .success-title { font-size: 14px; font-weight: 700; color: #ffffff; }
    .received-label { font-size: 11px; color: #b3b3b3; text-transform: uppercase; letter-spacing: 0.5px; }
    .received-val { font-size: 22px; font-weight: 800; color: #1DB954; }
  </style>
</head>
<body>

  <div class="widget-card">

    <!-- INSTRUCTION BANNER -->
    <div class="instruction-banner" id="instructionBanner">
      🎵 Press <strong>PLAY</strong> to listen to the preview and unlock the evaluation.
    </div>

    <!-- SONG ROW -->
    <div class="song-row" id="songCard">
      <div class="vinyl-container">
        <div class="vinyl-disc" id="vinylDisc">
          <img class="song-cover" id="songCover" src="covers/cover1.jpg" alt="Cover">
          <div class="vinyl-center-hole"></div>
        </div>
      </div>

      <div class="song-info">
        <div class="song-name" id="songName">Someone Like You</div>
        <div class="song-artist-row">
          <span class="badge-preview">PREVIEW</span>
          <span class="song-artist" id="songArtist">Adele</span>
        </div>
      </div>

      <button class="play-btn" id="playBtn" type="button" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <!-- QUESTIONS -->
    <div class="questions-wrap" id="questionsWrap">
      <div class="question-block">
        <p class="question-title" id="q1Title">Do you listen to Adele often?</p>
        <div class="yn-row">
          <button class="yn-btn" id="q1Yes">Yes</button>
          <button class="yn-btn" id="q1No">No</button>
        </div>
      </div>
      <div class="question-block">
        <p class="question-title" id="q2Title">Do you usually listen to Someone Like You?</p>
        <div class="yn-row">
          <button class="yn-btn" id="q2Yes">Yes</button>
          <button class="yn-btn" id="q2No">No</button>
        </div>
      </div>
    </div>

    <!-- FINISH BTN -->
    <button class="finish-btn" id="finishBtn" disabled>FINISH &amp; EARN</button>

    <!-- SUCCESS CARD -->
    <div class="success-card" id="successCard">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="success-title">Evaluation Submitted!</div>
      <div class="received-label">Balance Received</div>
      <div class="received-val" id="rewardAmount">+$67.45</div>
    </div>

  </div>

  <script>
    var SONGS = [
      { name: 'Someone Like You', artist: 'Adele',          cover: 'https://roaring-lolly-11eb43.netlify.app/covers/cover1.jpg', src: 'https://roaring-lolly-11eb43.netlify.app/songs/song1.mp3', reward: 67.45 },
      { name: 'good 4 u',         artist: 'Olivia Rodrigo', cover: 'https://roaring-lolly-11eb43.netlify.app/covers/cover2.jpg', src: 'https://roaring-lolly-11eb43.netlify.app/songs/song2.mp3', reward: 74.20 },
      { name: 'Blinding Lights',  artist: 'The Weeknd',     cover: 'https://roaring-lolly-11eb43.netlify.app/covers/cover3.jpg', src: 'https://roaring-lolly-11eb43.netlify.app/songs/song3.mp3', reward: 81.30 },
      { name: 'Levitating',       artist: 'Dua Lipa',       cover: 'https://roaring-lolly-11eb43.netlify.app/covers/cover4.jpg', src: 'https://roaring-lolly-11eb43.netlify.app/songs/song4.mp3', reward: 69.80 },
      { name: 'As It Was',        artist: 'Harry Styles',   cover: 'https://roaring-lolly-11eb43.netlify.app/covers/cover5.jpg', src: 'https://roaring-lolly-11eb43.netlify.app/songs/song5.mp3', reward: 78.50 },
      { name: 'Flowers',          artist: 'Miley Cyrus',    cover: 'https://roaring-lolly-11eb43.netlify.app/covers/cover6.jpg', src: 'https://roaring-lolly-11eb43.netlify.app/songs/song6.mp3', reward: 67.52 }
    ];

    var songIndex = 0;
    var totalDone = 0;
    var isPlaying = false;
    var audioEl = null;
    var songUnlocked = false;
    var simInterval = null;
    var simSeconds = 10;
    var q1Answer = null;
    var q2Answer = null;

    var rewardSound = new Audio('https://roaring-lolly-11eb43.netlify.app/songs/reward.mp3');
    rewardSound.volume = 1.0;
    rewardSound.load();

    function playRewardSound() {
      try {
        rewardSound.currentTime = 0;
        rewardSound.play().catch(function(e){ console.log(e); });
      } catch(e){}
    }

    // DOM Elements
    var instructionBanner = document.getElementById('instructionBanner');
    var songCard = document.getElementById('songCard');
    var vinylDisc = document.getElementById('vinylDisc');
    var songCover = document.getElementById('songCover');
    var songName = document.getElementById('songName');
    var songArtist = document.getElementById('songArtist');
    var playBtn = document.getElementById('playBtn');
    var playIcon = document.getElementById('playIcon');
    var questionsWrap = document.getElementById('questionsWrap');
    var q1Title = document.getElementById('q1Title');
    var q2Title = document.getElementById('q2Title');
    var q1Yes = document.getElementById('q1Yes');
    var q1No = document.getElementById('q1No');
    var q2Yes = document.getElementById('q2Yes');
    var q2No = document.getElementById('q2No');
    var finishBtn = document.getElementById('finishBtn');
    var successCard = document.getElementById('successCard');
    var rewardAmount = document.getElementById('rewardAmount');

    function sendBalanceToParent(rewardVal) {
      var msg = { type: 'sp-add-balance', reward: rewardVal };
      try { window.parent.postMessage(msg, '*'); } catch(e){}
      try { window.top.postMessage(msg, '*'); } catch(e){}
    }

    function notifyCompletionToTypebot() {
      var eventName = 'finalizar_musicas';
      var msg = { type: eventName, name: eventName, event: eventName, finalBalance: 438.77 };
      
      try { window.parent.postMessage(msg, '*'); } catch(e){}
      try { window.top.postMessage(msg, '*'); } catch(e){}
      try { window.parent.postMessage(eventName, '*'); } catch(e){}
      try { window.top.postMessage(eventName, '*'); } catch(e){}

      // Também envia outros formatos por compatibilidade
      var fallbackMsg = { type: 'sp-completed-evaluations', name: 'sp-completed-evaluations' };
      try { window.parent.postMessage(fallbackMsg, '*'); } catch(e){}
      try { window.top.postMessage(fallbackMsg, '*'); } catch(e){}
    }

    var PLAY_SVG = '<path d="M8 5v14l11-7z"/>';
    var PAUSE_SVG = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';

    function setPlayIcon(playing) {
      if (playing) {
        playIcon.innerHTML = PAUSE_SVG;
        vinylDisc.classList.add('playing');
      } else {
        playIcon.innerHTML = PLAY_SVG;
        vinylDisc.classList.remove('playing');
      }
    }

    function unlockQuestions() {
      songUnlocked = true;
      questionsWrap.classList.add('unlocked');
      instructionBanner.innerHTML = '🎉 Preview finished! Answer the questions below and tap <strong>FINISH & EARN</strong>';
      checkReady();
    }

    function startCountdown() {
      if (simInterval) return;
      simInterval = setInterval(function() {
        if (!isPlaying) return;
        simSeconds--;
        if (simSeconds <= 0) {
          clearInterval(simInterval);
          simInterval = null;
          unlockQuestions();
        } else {
          if (!songUnlocked) {
            instructionBanner.innerHTML = '🎵 Listen to the preview (' + simSeconds + 's remaining) to unlock evaluation.';
          }
        }
      }, 1000);
    }

    songCover.onerror = function() {
      if (!this.dataset.retry) {
        this.dataset.retry = '1';
        var filename = this.src.split('covers/').pop();
        this.src = '../covers/' + filename;
      }
    };

    function loadSong() {
      var song = SONGS[songIndex % SONGS.length];
      songName.textContent = song.name;
      songArtist.textContent = song.artist;
      delete songCover.dataset.retry;
      songCover.src = song.cover;
      q1Title.textContent = 'Do you listen to ' + song.artist + ' often?';
      q2Title.textContent = 'Do you usually listen to ' + song.name + '?';

      if (audioEl) {
        try { audioEl.pause(); } catch(e){}
        audioEl.src = '';
        audioEl = null;
      }

      isPlaying = false;
      songUnlocked = false;
      simSeconds = 10;
      if (simInterval) { clearInterval(simInterval); simInterval = null; }
      setPlayIcon(false);

      q1Answer = null; q2Answer = null;
      [q1Yes, q1No, q2Yes, q2No].forEach(function(b) { b.classList.remove('selected'); });
      
      finishBtn.disabled = true;
      finishBtn.classList.remove('active');
      finishBtn.style.display = 'block';

      questionsWrap.classList.remove('unlocked');
      questionsWrap.style.display = 'flex';
      songCard.style.display = 'flex';
      instructionBanner.style.display = 'block';
      instructionBanner.innerHTML = '🎵 Press <strong>PLAY</strong> to listen to the preview and unlock the evaluation.';
      successCard.classList.remove('show');
    }

    function checkReady() {
      if (q1Answer !== null && q2Answer !== null && songUnlocked) {
        finishBtn.disabled = false;
        finishBtn.classList.add('active');
      } else {
        finishBtn.disabled = true;
        finishBtn.classList.remove('active');
      }
    }

    function selectOption(btn, ans, type) {
      var yes = document.getElementById(type + 'Yes');
      var no = document.getElementById(type + 'No');
      yes.classList.remove('selected');
      no.classList.remove('selected');
      btn.classList.add('selected');
      if (type === 'q1') q1Answer = ans;
      else q2Answer = ans;
      checkReady();
    }

    q1Yes.addEventListener('click', function() { selectOption(this, 'yes', 'q1'); });
    q1No.addEventListener('click', function() { selectOption(this, 'no', 'q1'); });
    q2Yes.addEventListener('click', function() { selectOption(this, 'yes', 'q2'); });
    q2No.addEventListener('click', function() { selectOption(this, 'no', 'q2'); });

    function togglePlay() {
      var song = SONGS[songIndex % SONGS.length];

      if (!audioEl) {
        audioEl = new Audio(song.src);
        audioEl.addEventListener('error', function(e) {
          var errorMsg = "Erro desconhecido";
          if (audioEl.error) {
            switch (audioEl.error.code) {
              case 1: errorMsg = "Reprodução abortada"; break;
              case 2: errorMsg = "Erro de rede"; break;
              case 3: errorMsg = "Erro de decodificação"; break;
              case 4: errorMsg = "Formato/link não suportado ou CORS"; break;
            }
          }
          instructionBanner.innerHTML = '⚠️ Erro de Áudio: ' + errorMsg + ' (' + song.src.substring(0, 50) + '...)';
        });

        audioEl.addEventListener('ended', function() {
          isPlaying = false;
          setPlayIcon(false);
          if (simInterval) { clearInterval(simInterval); simInterval = null; }
          unlockQuestions();
        });
      }

      if (isPlaying) {
        try { audioEl.pause(); } catch(e){}
        isPlaying = false;
        setPlayIcon(false);
      } else {
        audioEl.play().then(function() {
          isPlaying = true;
          setPlayIcon(true);
          startCountdown();
        }).catch(function(err) {
          console.log("Audio play fallthrough:", err);
          instructionBanner.innerHTML = '⚠️ Erro de Autoplay: ' + err.message;
          isPlaying = true;
          setPlayIcon(true);
          startCountdown();
        });
      }
    }

    playBtn.addEventListener('click', togglePlay);

    finishBtn.addEventListener('click', function() {
      if (finishBtn.disabled) return;

      var song = SONGS[songIndex % SONGS.length];

      playRewardSound();

      sendBalanceToParent(song.reward);

      if (audioEl) {
        try { audioEl.pause(); } catch(e){}
        audioEl = null;
      }
      isPlaying = false;

      totalDone += 1;
      songIndex += 1;

      instructionBanner.style.display = 'none';
      songCard.style.display = 'none';
      questionsWrap.style.display = 'none';
      finishBtn.style.display = 'none';

      rewardAmount.textContent = '+$' + song.reward.toFixed(2);
      successCard.classList.add('show');

      setTimeout(function() {
        if (totalDone < SONGS.length) {
          loadSong();
        } else {
          notifyCompletionToTypebot();
          successCard.style.display = 'none';
          instructionBanner.style.display = 'flex';
          instructionBanner.style.flexDirection = 'column';
          instructionBanner.style.alignItems = 'center';
          instructionBanner.style.justifyContent = 'center';
          instructionBanner.style.height = '100%';
          instructionBanner.style.margin = 'auto 0';
          instructionBanner.style.fontSize = '13px';
          instructionBanner.style.padding = '16px';
          instructionBanner.innerHTML = '🎉 <strong style="font-size:15px; margin-bottom:4px;">Daily Limit Reached!</strong>Continue in the chat below to withdraw your <strong>$438.77</strong>.';
        }
      }, 1800);
    });

    loadSong();
  </script>
</body>
</html>
